name: Publish T-ETH-Lite OTA release

on:
  push:
    tags:
      - 'v*-t-eth-lite'

permissions:
  contents: write

concurrency:
  group: publish-t-eth-lite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the primary image and validate the legacy profile
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-t-eth-lite}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/firmware/bacnet_bridge \
            espressif/idf:v5.3.1 \
            idf.py -B build-release -DSDKCONFIG=build-release/sdkconfig \
              -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.t_eth_lite.defaults' build
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/firmware/bacnet_bridge \
            espressif/idf:v5.3.1 \
            idf.py -B build-w5500-release -DSDKCONFIG=build-w5500-release/sdkconfig \
              -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.w5500.defaults' build
          BUILT_VERSION=$(jq -r '.project_version' firmware/bacnet_bridge/build-release/project_description.json)
          test "$BUILT_VERSION" = "$VERSION" || {
            echo "Tag version $VERSION does not match firmware version $BUILT_VERSION" >&2
            exit 1
          }
          sha256sum firmware/bacnet_bridge/build-release/bacnet_bridge.bin | tee release.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BIN=firmware/bacnet_bridge/build-release/bacnet_bridge.bin
          VERSION="${TAG#v}"
          VERSION="${VERSION%-t-eth-lite}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BIN" --clobber
          else
            gh release create "$TAG" "$BIN" \
              --title "T-ETH-Lite $VERSION" --generate-notes
          fi

      - name: Publish the checked release manifest
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION%-t-eth-lite}"
          git fetch origin master --tags
          git merge-base --is-ancestor "$TAG" origin/master || {
            echo "Release tag must point to a commit on master" >&2
            exit 1
          }
          PREVIOUS_TAG=$(git tag --list 'v*-t-eth-lite' --sort=-version:refname | grep -vx "$TAG" | head -n1 || true)
          CHANGELOG_FILE=$(mktemp)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --format='%s' "$PREVIOUS_TAG..$TAG" > "$CHANGELOG_FILE"
          else
            git log --format='%s' "$TAG" > "$CHANGELOG_FILE"
          fi
          jq -Rn '[inputs | select(length > 0)]' < "$CHANGELOG_FILE" > /tmp/changelog.json
          SHA256=$(cut -d' ' -f1 release.sha256)
          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/bacnet_bridge.bin"
          git checkout master
          git pull --ff-only origin master
          jq -n \
            --arg board t-eth-lite --arg version "$VERSION" --arg published_at "$(date -u +%F)" \
            --arg image_url "$IMAGE_URL" --arg sha256 "$SHA256" \
            --slurpfile changelog /tmp/changelog.json \
            '{board:$board, version:$version, published_at:$published_at, image_url:$image_url, sha256:$sha256, changelog:$changelog[0]}' \
            > releases/t-eth-lite.json
          git diff --quiet -- releases/t-eth-lite.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/t-eth-lite.json
          git commit -m "release: publish T-ETH-Lite $VERSION OTA manifest"
          git push origin HEAD:master
